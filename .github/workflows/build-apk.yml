name: Build StackDialer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: 'stable'
          cache: true

      - name: Auto Fix Code and Build APK
        run: |
          echo "=== 1. Fixing Dart CallLog collision ==="
          find . -name "telecom_service.dart" -exec sed -i "s/import 'package:call_log\/call_log.dart';/import 'package:call_log\/call_log.dart' as cl;/g" {} + 2>/dev/null || true
          find . -name "telecom_service.dart" -exec sed -i "s/CallLog\./cl.CallLog\./g" {} + 2>/dev/null || true
          find . -name "telecom_service.dart" -exec sed -i "s/CallLogEntry/cl.CallLogEntry/g" {} + 2>/dev/null || true
          find . -name "telecom_service.dart" -exec sed -i "s/CallType\./cl.CallType\./g" {} + 2>/dev/null || true

          echo "=== 2. Upgrading dependencies ==="
          find . -name "pubspec.yaml" -exec sed -i "s/flutter_phone_direct_caller:.*/flutter_phone_direct_caller: ^2.2.0/g" {} + 2>/dev/null || true
          find . -name "pubspec.yaml" -exec sed -i "s/call_log:.*/call_log: ^6.0.0/g" {} + 2>/dev/null || true

          echo "=== 3. Navigating to Flutter directory ==="
          if [ -d "flutter_app" ]; then
            cd flutter_app
          fi

          echo "=== 4. Setting minSdk to 26 ==="
          find android -name "build.gradle*" -exec sed -i "s/minSdkVersion = .*/minSdkVersion = 26/g" {} + 2>/dev/null || true
          find android -name "build.gradle*" -exec sed -i "s/minSdk = .*/minSdk = 26/g" {} + 2>/dev/null || true
          find android -name "build.gradle*" -exec sed -i "s/flutter.minSdkVersion/26/g" {} + 2>/dev/null || true

          echo "=== 5. Running flutter pub get ==="
          flutter pub get

          echo "=== 6. Building Release APK ==="
          flutter build apk --release

      - name: Prepare APK Output
        run: |
          mkdir -p release_out
          APK_FILE=$(find . -name "app-release.apk" -o -name "*release*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release_out/StackDialer.apk
            echo "Copied APK successfully to release_out/StackDialer.apk"
            ls -lh release_out/StackDialer.apk
          else
            echo "Error: APK not found!"
            find . -name "*.apk"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StackDialer-Release-APK
          path: release_out/StackDialer.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-apk
          name: StackDialer Native Android v1.0
          body: "StackDialer Native Android Release APK"
          files: release_out/StackDialer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
